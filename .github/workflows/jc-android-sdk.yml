name: Build job container for Android SDK

on: 
  push:
    branches:
      - dev
      - stage
    # paths:
    #   - "jobcontainers/build-android-sdk/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push job container image
        uses: docker/build-push-action@v5
        with:
          context: ./jobcontainers/build-android-sdk
          push: false
          load: true
          tags:
            ${{ vars.REPOSITORY }}:build-android-sdk
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REPOSITORY }}:build-android-sdk
          format: 'table'
          #exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Push Image
        run: docker push ${{ vars.REPOSITORY }}:build-android-sdk