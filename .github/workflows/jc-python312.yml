name: Build job container for Python 3.12

on: 
  push:
    branches:
      - dev
      - stage
    paths:
      - "jobcontainers/build-python312/**"
      
jobs:
  build-jc-python312:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker Image 
        uses: docker/build-push-action@v7
        with:
          context: ./jobcontainers/build-python312
          load: true
          push: false
          tags: ${{ vars.REPOSITORY }}:build-python312
      - name: Scanning Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REPOSITORY }}:build-python312
          format: 'table'
          #exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Push Image to Artifactory
        run: docker push ${{ vars.REPOSITORY }}:build-python312
